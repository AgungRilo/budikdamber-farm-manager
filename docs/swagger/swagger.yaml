basePath: /api/v1
definitions:
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.Cycle:
    properties:
      age_days:
        type: integer
      alive_qty:
        type: integer
      code:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      dead_qty:
        type: integer
      end_date:
        type: string
      id:
        type: integer
      initial_qty:
        type: integer
      notes:
        type: string
      pond_id:
        type: integer
      pond_name:
        type: string
      seed_price_per_fish:
        type: integer
      seed_size_cm:
        type: number
      sold_qty:
        type: integer
      species_id:
        type: integer
      species_name:
        type: string
      start_date:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  model.CycleCloseInput:
    properties:
      end_date:
        type: string
    type: object
  model.CycleInput:
    properties:
      initial_qty:
        type: integer
      notes:
        maxLength: 500
        type: string
      pond_id:
        type: integer
      seed_price_per_fish:
        minimum: 0
        type: integer
      seed_size_cm:
        type: number
      species_id:
        type: integer
      start_date:
        type: string
    required:
    - initial_qty
    - pond_id
    - species_id
    - start_date
    type: object
  model.CycleMetrics:
    properties:
      alive_qty:
        type: integer
      code:
        type: string
      cycle_id:
        type: integer
      dead_qty:
        type: integer
      feed_cost:
        type: integer
      feed_gram:
        type: integer
      hpp_per_fish:
        description: null kalau tidak ada ikan yang bertahan
        type: integer
      initial_qty:
        type: integer
      is_final:
        description: false = siklus masih berjalan, angka sementara
        type: boolean
      margin_pct:
        description: null kalau belum ada pendapatan
        type: number
      other_cost:
        type: integer
      own_use_qty:
        type: integer
      profit:
        type: integer
      receivable:
        type: integer
      revenue:
        type: integer
      sale_qty:
        type: integer
      seed_cost:
        type: integer
      status:
        type: string
      survival_rate_pct:
        type: number
      total_cost:
        type: integer
    type: object
  model.Expense:
    properties:
      amount:
        type: integer
      category:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      created_by_name:
        type: string
      cycle_code:
        type: string
      cycle_id:
        type: integer
      description:
        type: string
      expense_date:
        type: string
      id:
        type: integer
      updated_at:
        type: string
    type: object
  model.ExpenseInput:
    properties:
      amount:
        type: integer
      category:
        enum:
        - obat_probiotik
        - peralatan
        - utilitas
        - tenaga_kerja
        - lainnya
        type: string
      cycle_id:
        type: integer
      description:
        maxLength: 200
        type: string
      expense_date:
        type: string
    required:
    - amount
    - category
    - description
    - expense_date
    type: object
  model.Feed:
    properties:
      brand:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      price_per_kg:
        type: integer
      protein_pct:
        type: number
      updated_at:
        type: string
    type: object
  model.FeedInput:
    properties:
      brand:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        type: string
      price_per_kg:
        type: integer
      protein_pct:
        maximum: 100
        minimum: 0
        type: number
    required:
    - name
    - price_per_kg
    type: object
  model.FeedLog:
    properties:
      cost:
        type: integer
      created_at:
        type: string
      created_by:
        type: integer
      created_by_name:
        type: string
      cycle_id:
        type: integer
      feed_id:
        type: integer
      feed_name:
        type: string
      id:
        type: integer
      log_date:
        type: string
      notes:
        type: string
      price_per_kg:
        type: integer
      qty_gram:
        type: integer
    type: object
  model.FeedLogInput:
    properties:
      feed_id:
        type: integer
      log_date:
        type: string
      notes:
        maxLength: 500
        type: string
      qty_gram:
        maximum: 100000
        type: integer
    required:
    - feed_id
    - log_date
    - qty_gram
    type: object
  model.FishSpecies:
    properties:
      created_at:
        type: string
      default_price_per_fish:
        type: integer
      default_price_per_kg:
        type: integer
      id:
        type: integer
      name:
        type: string
      target_days:
        type: integer
      updated_at:
        type: string
    type: object
  model.FishSpeciesInput:
    properties:
      default_price_per_fish:
        minimum: 0
        type: integer
      default_price_per_kg:
        minimum: 0
        type: integer
      name:
        maxLength: 100
        type: string
      target_days:
        type: integer
    required:
    - name
    type: object
  model.MortalityCreateResult:
    properties:
      alive_qty_after:
        type: integer
      cause:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      created_by_name:
        type: string
      cycle_closed:
        type: boolean
      cycle_id:
        type: integer
      id:
        type: integer
      log_date:
        type: string
      notes:
        type: string
      qty:
        type: integer
    type: object
  model.MortalityLog:
    properties:
      cause:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      created_by_name:
        type: string
      cycle_id:
        type: integer
      id:
        type: integer
      log_date:
        type: string
      notes:
        type: string
      qty:
        type: integer
    type: object
  model.MortalityLogInput:
    properties:
      cause:
        maxLength: 100
        type: string
      log_date:
        type: string
      notes:
        maxLength: 500
        type: string
      qty:
        type: integer
    required:
    - log_date
    - qty
    type: object
  model.Pond:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      max_stock:
        type: integer
      name:
        type: string
      notes:
        type: string
      type:
        type: string
      updated_at:
        type: string
      volume_liter:
        type: integer
    type: object
  model.PondInput:
    properties:
      is_active:
        type: boolean
      max_stock:
        type: integer
      name:
        maxLength: 100
        type: string
      notes:
        maxLength: 500
        type: string
      type:
        enum:
        - ember
        - terpal
        - kolam_tanah
        - kolam_beton
        type: string
      volume_liter:
        type: integer
    required:
    - max_stock
    - name
    - type
    type: object
  model.RegisterInput:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  model.Sale:
    properties:
      buyer_name:
        type: string
      channel:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      created_by_name:
        type: string
      cycle_id:
        type: integer
      id:
        type: integer
      is_paid:
        type: boolean
      notes:
        type: string
      price_per_fish:
        type: integer
      qty:
        type: integer
      sale_date:
        type: string
      sale_type:
        type: string
      total:
        type: integer
      updated_at:
        type: string
      weight_kg:
        type: number
    type: object
  model.SaleCreateResult:
    properties:
      alive_qty_after:
        type: integer
      buyer_name:
        type: string
      channel:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      created_by_name:
        type: string
      cycle_closed:
        type: boolean
      cycle_id:
        type: integer
      id:
        type: integer
      is_paid:
        type: boolean
      notes:
        type: string
      price_per_fish:
        type: integer
      qty:
        type: integer
      sale_date:
        type: string
      sale_type:
        type: string
      total:
        type: integer
      updated_at:
        type: string
      weight_kg:
        type: number
    type: object
  model.SaleInput:
    properties:
      buyer_name:
        maxLength: 100
        type: string
      channel:
        enum:
        - langsung
        - pasar
        - pengepul
        - online
        type: string
      is_paid:
        type: boolean
      notes:
        maxLength: 500
        type: string
      price_per_fish:
        description: kosong → harga default jenis ikan
        minimum: 0
        type: integer
      qty:
        type: integer
      sale_date:
        type: string
      sale_type:
        enum:
        - sale
        - own_use
        type: string
      weight_kg:
        type: number
    required:
    - qty
    - sale_date
    type: object
  model.SalePaidInput:
    properties:
      is_paid:
        type: boolean
    required:
    - is_paid
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  model.UserCreateInput:
    properties:
      email:
        maxLength: 150
        type: string
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      role:
        enum:
        - owner
        - worker
        type: string
    required:
    - email
    - name
    - password
    type: object
  model.UserStatusInput:
    properties:
      is_active:
        type: boolean
    required:
    - is_active
    type: object
  model.UserUpdateInput:
    properties:
      email:
        maxLength: 150
        type: string
      name:
        maxLength: 100
        type: string
      password:
        description: diisi hanya kalau mau reset
        maxLength: 72
        minLength: 8
        type: string
      role:
        enum:
        - owner
        - worker
        type: string
    required:
    - email
    - name
    - role
    type: object
  response.Body:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  service.LoginResult:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
info:
  contact: {}
  description: 'Backend API manajemen budidaya ikan rumahan: siklus, log pakan & kematian,
    penjualan, dan laporan laba.'
  title: Budikdamber Farm Manager API
  version: "1.0"
paths:
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Profil user yang sedang login
      tags:
      - Auth
  /cycles:
    get:
      parameters:
      - description: Status
        enum:
        - active
        - closed
        in: query
        name: status
        type: string
      - description: Filter wadah
        in: query
        name: pond_id
        type: integer
      - description: Filter jenis ikan
        in: query
        name: species_id
        type: integer
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 10
        description: Jumlah per halaman
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Cycle'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
      security:
      - BearerAuth: []
      summary: Daftar siklus budidaya
      tags:
      - Cycles
    post:
      consumes:
      - application/json
      parameters:
      - description: Data siklus
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CycleInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.Cycle'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Kapasitas wadah tidak cukup
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Mulai siklus baru / tebar bibit (owner)
      tags:
      - Cycles
  /cycles/{id}:
    get:
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.Cycle'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Detail siklus (termasuk jumlah hidup, mati, terjual)
      tags:
      - Cycles
  /cycles/{id}/close:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
        type: integer
      - description: Tanggal selesai (default hari ini)
        in: body
        name: body
        schema:
          $ref: '#/definitions/model.CycleCloseInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.Cycle'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Tutup siklus manual (owner)
      tags:
      - Cycles
  /cycles/{id}/feed-logs:
    get:
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
        type: integer
      - description: Dari tanggal (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Sampai tanggal (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 20
        description: Jumlah per halaman
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.FeedLog'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Daftar log pakan per siklus
      tags:
      - Feed Logs
    post:
      consumes:
      - application/json
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
        type: integer
      - description: Data log pakan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.FeedLogInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.FeedLog'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Catat pemberian pakan (owner & worker)
      tags:
      - Feed Logs
  /cycles/{id}/metrics:
    get:
      description: Angka bersifat sementara selama siklus masih aktif (is_final=false).
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.CycleMetrics'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 'Metrik bisnis siklus: SR, biaya, HPP, laba, margin (owner)'
      tags:
      - Cycles
  /cycles/{id}/mortality-logs:
    get:
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
        type: integer
      - description: Dari tanggal (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Sampai tanggal (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 20
        description: Jumlah per halaman
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.MortalityLog'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Daftar log kematian per siklus
      tags:
      - Mortality Logs
    post:
      consumes:
      - application/json
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
        type: integer
      - description: Data log kematian
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.MortalityLogInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.MortalityCreateResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Catat ikan mati (owner & worker); siklus otomatis ditutup jika ikan
        hidup habis
      tags:
      - Mortality Logs
  /cycles/{id}/reopen:
    post:
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.Cycle'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Buka kembali siklus yang sudah ditutup (owner)
      tags:
      - Cycles
  /cycles/{id}/sales:
    get:
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
        type: integer
      - description: Dari tanggal (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Sampai tanggal (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: Jenis
        enum:
        - sale
        - own_use
        in: query
        name: sale_type
        type: string
      - description: Status lunas
        in: query
        name: is_paid
        type: boolean
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 20
        description: Jumlah per halaman
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Sale'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Daftar penjualan per siklus
      tags:
      - Sales
    post:
      consumes:
      - application/json
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
