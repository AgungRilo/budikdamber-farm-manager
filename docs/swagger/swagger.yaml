        in: query
        name: limit
        type: integer
      - description: Cari berdasarkan nama
        in: query
        name: search
        type: string
      - description: Jenis wadah
        enum:
        - ember
        - terpal
        - kolam_tanah
        - kolam_beton
        in: query
        name: type
        type: string
      - description: Status aktif
        in: query
        name: is_active
        type: boolean
      produces:
