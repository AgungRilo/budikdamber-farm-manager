                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
      security:
      - BearerAuth: []
      summary: Daftar jenis ikan
      tags:
      - Fish Species
    post:
      consumes:
      - application/json
      parameters:
      - description: Data jenis ikan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.FishSpeciesInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.FishSpecies'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Buat jenis ikan (owner)
      tags:
      - Fish Species
  /fish-species/{id}:
    delete:
      parameters:
      - description: ID jenis ikan
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Hapus jenis ikan / soft delete (owner)
      tags:
      - Fish Species
    get:
      parameters:
      - description: ID jenis ikan
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.FishSpecies'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Detail jenis ikan
      tags:
