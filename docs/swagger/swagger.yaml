    put:
      consumes:
      - application/json
      parameters:
      - description: ID jenis ikan
        in: path
        name: id
        required: true
        type: integer
      - description: Data jenis ikan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.FishSpeciesInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
