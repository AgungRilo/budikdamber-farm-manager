basePath: /api/v1
definitions:
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.Cycle:
    properties:
      age_days:
        type: integer
      alive_qty:
        type: integer
      code:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      dead_qty:
        type: integer
      end_date:
        type: string
      id:
        type: integer
      initial_qty:
        type: integer
      notes:
        type: string
      pond_id:
        type: integer
      pond_name:
        type: string
      seed_price_per_fish:
        type: integer
      seed_size_cm:
        type: number
      sold_qty:
        type: integer
      species_id:
        type: integer
      species_name:
        type: string
      start_date:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  model.CycleInput:
    properties:
      initial_qty:
        type: integer
      notes:
        maxLength: 500
        type: string
      pond_id:
        type: integer
      seed_price_per_fish:
        minimum: 0
        type: integer
      seed_size_cm:
        type: number
      species_id:
        type: integer
      start_date:
        type: string
    required:
    - initial_qty
    - pond_id
    - species_id
    - start_date
    type: object
  model.Feed:
    properties:
      brand:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      price_per_kg:
        type: integer
      protein_pct:
        type: number
      updated_at:
        type: string
    type: object
  model.FeedInput:
    properties:
      brand:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        type: string
      price_per_kg:
        type: integer
      protein_pct:
        maximum: 100
        minimum: 0
        type: number
    required:
    - name
    - price_per_kg
    type: object
  model.FishSpecies:
    properties:
      created_at:
        type: string
      default_price_per_fish:
        type: integer
      default_price_per_kg:
        type: integer
      id:
        type: integer
      name:
        type: string
      target_days:
        type: integer
      updated_at:
        type: string
    type: object
  model.FishSpeciesInput:
    properties:
      default_price_per_fish:
        minimum: 0
        type: integer
      default_price_per_kg:
        minimum: 0
        type: integer
      name:
        maxLength: 100
        type: string
      target_days:
        type: integer
    required:
    - name
    type: object
  model.Pond:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      max_stock:
        type: integer
      name:
        type: string
      notes:
        type: string
      type:
        type: string
      updated_at:
        type: string
      volume_liter:
        type: integer
    type: object
  model.PondInput:
    properties:
      is_active:
        type: boolean
      max_stock:
        type: integer
      name:
        maxLength: 100
        type: string
      notes:
        maxLength: 500
        type: string
      type:
        enum:
        - ember
        - terpal
        - kolam_tanah
        - kolam_beton
        type: string
      volume_liter:
        type: integer
    required:
    - max_stock
    - name
    - type
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  model.UserStatusInput:
    properties:
      is_active:
        type: boolean
    required:
    - is_active
    type: object
  response.Body:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  service.LoginResult:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
info:
  contact: {}
  description: 'Backend API manajemen budidaya ikan rumahan: siklus, log pakan & kematian,
    penjualan, dan laporan laba.'
  title: Budikdamber Farm Manager API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login dengan email & password, mengembalikan JWT.
      parameters:
      - description: Kredensial
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
      summary: Login
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Profil user yang sedang login
      tags:
      - Auth
  /cycles:
    get:
      parameters:
      - description: Status
        enum:
        - active
        - closed
        in: query
        name: status
        type: string
      - description: Filter wadah
        in: query
        name: pond_id
        type: integer
      - description: Filter jenis ikan
        in: query
        name: species_id
        type: integer
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 10
        description: Jumlah per halaman
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Cycle'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
      security:
      - BearerAuth: []
      summary: Daftar siklus budidaya
      tags:
      - Cycles
    post:
      consumes:
      - application/json
      parameters:
      - description: Data siklus
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CycleInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.Cycle'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Kapasitas wadah tidak cukup
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Mulai siklus baru / tebar bibit (owner)
      tags:
      - Cycles
  /cycles/{id}:
    get:
      parameters:
      - description: ID siklus
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.Cycle'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Detail siklus (termasuk jumlah hidup, mati, terjual)
      tags:
      - Cycles
  /feeds:
    get:
      parameters:
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 10
        description: Jumlah per halaman
        in: query
        name: limit
        type: integer
      - description: Cari nama / merek
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Feed'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
      security:
      - BearerAuth: []
      summary: Daftar pakan
      tags:
      - Feeds
    post:
      consumes:
      - application/json
      parameters:
      - description: Data pakan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.FeedInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.Feed'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Buat pakan (owner)
      tags:
      - Feeds
  /feeds/{id}:
    delete:
      parameters:
      - description: ID pakan
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Hapus pakan / soft delete (owner)
      tags:
      - Feeds
    get:
      parameters:
      - description: ID pakan
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.Feed'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Detail pakan
      tags:
      - Feeds
    put:
      consumes:
      - application/json
      parameters:
      - description: ID pakan
        in: path
        name: id
        required: true
        type: integer
      - description: Data pakan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.FeedInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/model.Feed'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Ubah pakan (owner)
      tags:
      - Feeds
  /fish-species:
